            - heading [level=3] [ref=f1e319]:
              - button "Windows SmartScreen 提示如何处理？" [ref=f1e320] [cursor=pointer]
            - paragraph [ref=f1e323]: 开源构建未购买商业 EV 代码签名证书时，SmartScreen 可能提示未知发布者。你可以核验 GitHub 发布页和 SHA-256，或选择便携 ZIP 版本。
