version: '3.8'

services:
  # MySQL 8.0 数据库服务
  mysql:
    image: mysql:8.0
    container_name: ai_helper_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_here}
      MYSQL_DATABASE: ai_helper_telemetry
    # 不暴露 MySQL 端口到宿主机，仅允许内部服务间通信
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD:-root_password_here} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # AI-Helper 监控与诊断 API 服务
  telemetry_api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: ai_helper_telemetry_api
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-root_password_here}}
      DB_NAME: ai_helper_telemetry
      ADMIN_TOKEN: ${ADMIN_TOKEN:?请在 .env 中设置 ADMIN_TOKEN}
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:-}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
