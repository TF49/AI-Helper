[package]
name = "ai-helper"
version = "1.0.27"
description = "AI Helper - ChatGPT & Claude Code 配置管理工具"
authors = []
license = "MIT"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "ai_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
default = []

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.2", features = ["protocol-asset", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
dirs = "5.0"
toml_edit = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2.0"
anyhow = "1.0"
opener = "0.8.5"
sysinfo = "0.31"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"

[dev-dependencies]
tempfile = "3"
