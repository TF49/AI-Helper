name: Update Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    name: Check if release is needed
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check if tag already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_ver=$(jq -r .version package.json)
          tag="v${package_ver}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists on GitHub. Skipping release build."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Release $tag does not exist. Proceeding with release build."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build-windows:
    name: Build Windows x64
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 10.12.3

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          toolchain: '1.95'

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: Package release
        id: package
        run: |
          $package = Get-Content -LiteralPath package.json -Encoding UTF8 -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          ./scripts/package-release.ps1 -Tag $tag
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-assets
          path: release/${{ steps.package.outputs.tag }}/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 10.12.3

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # master
        with:
          toolchain: '1.95'
          targets: ${{ matrix.target }}
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DMG installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Package macOS release
        id: package
        run: |
          chmod +x ./scripts/package-macos.sh
          ./scripts/package-macos.sh "" "${{ matrix.target }}"
          package_ver=$(node -p "require('./package.json').version")
          echo "tag=v${package_ver}" >> $GITHUB_OUTPUT

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-assets-${{ matrix.target }}
          path: release/${{ steps.package.outputs.tag }}/*
          if-no-files-found: error

  update-release:
    name: Update latest release
    needs: [check-version, build-windows, build-macos]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Prepare release directory
        id: prep
        run: |
          mkdir -p release_assets
          find artifacts -type f -exec cp {} release_assets/ \;
          package_ver=$(node -p "require('./package.json').version")
          tag="v${package_ver}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          ls -la release_assets/

      - name: Verify release immutability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prep.outputs.tag }}
        run: |
          tag="${RELEASE_TAG}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists! Overwriting or clobbering published release binaries and manifests is strictly prohibited to guarantee update anti-replay integrity and reproducible signatures. Please increment the version in package.json and publish a new release tag."
            exit 1
          fi

      - name: Create new release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prep.outputs.tag }}
        run: |
          tag="${RELEASE_TAG}"
          notes="docs/releases/${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing release notes: $notes"
            exit 1
          fi
          assets=(release_assets/*)
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AI Helper $tag" --notes-file "$notes" --latest
