name: Update Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: update-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-release:
    name: Build and update latest release
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: Package release
        id: package
        run: |
          $package = Get-Content -LiteralPath package.json -Encoding UTF8 -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          ./scripts/package-release.ps1 -Tag $tag
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          # try/catch cannot catch native command exit codes in PowerShell.
          # GitHub Actions sets $ErrorActionPreference='Stop' by default, so gh returning
          # exit code 1 (release not found) would abort the step before catch runs.
          # Fix: temporarily allow non-zero exit codes and check $LASTEXITCODE directly.
          $ErrorActionPreference = 'Continue'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0).ToString().ToLower()
          $ErrorActionPreference = 'Stop'
          "exists=$exists" >> $env:GITHUB_OUTPUT

      - name: Delete old release assets
        if: steps.check_release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          # gh CLI non-zero exit codes must not abort the step; check $LASTEXITCODE manually.
          $ErrorActionPreference = 'Continue'
          $assets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets -q '.assets[].name' 2>$null |
                    Where-Object { $_ -and ($_ -notlike 'Source code*') }
          if ($LASTEXITCODE -ne 0) { throw "Failed to list release assets for $tag" }
          $ErrorActionPreference = 'Stop'
          if (-not $assets) {
            Write-Host "No assets to delete for release $tag"
          } else {
            foreach ($asset in $assets) {
              Write-Host "删除旧资产: $asset"
              $ErrorActionPreference = 'Continue'
              gh release delete-asset $tag $asset --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { Write-Warning "Failed to delete asset: $asset (exit code $LASTEXITCODE)" }
              $ErrorActionPreference = 'Stop'
            }
          }

      - name: Upload new assets to existing release
        if: steps.check_release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @(Get-ChildItem -LiteralPath "release/$tag" -File | Select-Object -ExpandProperty FullName)
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber

          # 更新发布说明
          $notes = "docs/releases/$tag.md"
          if (Test-Path -LiteralPath $notes) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $notes
          }

      - name: Create new release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes"
          }
          $assets = @(Get-ChildItem -LiteralPath "release/$tag" -File | Select-Object -ExpandProperty FullName)
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "BobAPI Tool $tag" --notes-file $notes --latest
