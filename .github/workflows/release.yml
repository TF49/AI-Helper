name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # 匹配 v1.0.0, v1.2.3 等格式
  workflow_dispatch:  # 保留手动触发选项
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ai-helper-release
  cancel-in-progress: false

jobs:
  check-version:
    name: Validate release identity and availability
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Check release without changing published assets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release.mjs

  windows:
    name: Build Windows x64
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis
      - name: Package release
        id: package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $package = Get-Content -LiteralPath package.json -Encoding UTF8 -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          ./scripts/package-release.ps1 -Tag $tag
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-assets
          path: |
            release/${{ steps.package.outputs.tag }}/*.exe
            release/${{ steps.package.outputs.tag }}/*.sig
            release/${{ steps.package.outputs.tag }}/*.zip
            release/${{ steps.package.outputs.tag }}/*.json
            release/${{ steps.package.outputs.tag }}/SHA256SUMS.txt
          if-no-files-found: error

  macos:
    name: Build macOS (${{ matrix.target }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95'
          targets: ${{ matrix.target }}
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build DMG installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg
      - name: Package macOS release
        id: package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x ./scripts/package-macos.sh
          ./scripts/package-macos.sh "" "${{ matrix.target }}"
          package_ver=$(node -p "require('./package.json').version")
          echo "tag=v${package_ver}" >> $GITHUB_OUTPUT
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-assets-${{ matrix.target }}
          path: |
            release/${{ steps.package.outputs.tag }}/*.dmg
            release/${{ steps.package.outputs.tag }}/*.dmg.sig
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [check-version, windows, macos]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.3
      - name: Install release tooling
        run: pnpm install --frozen-lockfile
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: artifacts
      - name: Prepare release directory
        id: prep
        run: |
          mkdir -p release_assets
          # 将所有子目录下载的文件合并到 release_assets
          find artifacts -type f -exec cp {} release_assets/ \;
          package_ver=$(node -p "require('./package.json').version")
          tag="v${package_ver}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          ls -la release_assets/
      - name: Sign final multi-platform update manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pwsh -NoProfile -File scripts/finalize-update-manifest.ps1 -AssetRoot release_assets -Tag "${{ steps.prep.outputs.tag }}"
      - name: Recheck tag identity and release absence before publishing
        id: final-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release.mjs
      - name: Publish release to GitHub
        if: steps.final-check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prep.outputs.tag }}
        run: |
          tag="${RELEASE_TAG}"
          notes="docs/releases/${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing release notes: $notes"
            exit 1
          fi
          assets=(release_assets/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi
          target_sha="$(git rev-parse HEAD)"
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$target_sha" --title "AI Helper $tag" --notes-file "$notes" --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
