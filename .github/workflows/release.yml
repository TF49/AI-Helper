name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # 匹配 v1.0.0, v1.2.3 等格式
  workflow_dispatch:  # 保留手动触发选项

permissions:
  contents: write

concurrency:
  group: bobapi-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis
      - name: Package release
        id: package
        run: |
          $package = Get-Content -LiteralPath package.json -Encoding UTF8 -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          ./scripts/package-release.ps1 -Tag $tag
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Preserve build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BobAPI-Tool-${{ steps.package.outputs.tag }}-Windows-x64
          path: |
            release/${{ steps.package.outputs.tag }}/*.exe
            release/${{ steps.package.outputs.tag }}/*.sig
            release/${{ steps.package.outputs.tag }}/*.zip
            release/${{ steps.package.outputs.tag }}/*.json
            release/${{ steps.package.outputs.tag }}/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          $assets = @(Get-ChildItem -LiteralPath "release/$tag" -File | Select-Object -ExpandProperty FullName)
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "BobAPI Tool $tag" --notes-file $notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are never overwritten.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release is still a draft; inspect its uploaded assets before publishing.' }
